[package]
name = "caption-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]

[dependencies]
clap = { version = "4", features = ["derive"] }
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
whisper-rs = { version = "=0.14.2", optional = true }

[dev-dependencies]
pretty_assertions = "1"
