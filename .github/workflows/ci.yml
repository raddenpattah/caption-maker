name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test caption-core on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test (no-default-features)
        run: cargo test -p caption-core --no-default-features
      - name: Test (with whisper)
        run: cargo test -p caption-core
