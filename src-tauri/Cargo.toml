[package]
name = "caption-tauri"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "caption_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caption-core = { path = "../caption-core", default-features = false }

[features]
default = ["whisper"]
whisper = ["caption-core/whisper"]

[dev-dependencies]
pretty_assertions = "1"
